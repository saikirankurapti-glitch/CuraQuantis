# Deploy the Express backend from /backend to Azure App Service
name: Build and deploy Node.js app to Azure Web App - curaquantis

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_curaquantis.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'curaquantis'
          slot-name: 'Production'
          package: './backend'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FE6B423C9D6A4570860BB61AAC4429A9 }}
